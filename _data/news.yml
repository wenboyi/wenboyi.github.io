  content: "Happy to share that a review paper on the relationship between behavioral, emotional, and physiological dynamics in social interaction is now online in the [*Annals of the New York Academy of Sciences*](https://nyaspubs.onlinelibrary.wiley.com/doi/full/10.1111/nyas.70326)!"

