  content: "Excited to share that the second paper of my Ph.D. is now online in [*Psychophysiology*](https://onlinelibrary.wiley.com/doi/10.1111/psyp.70254)! This paper investigates how individuals synchronize respiration and heart in joint action."

- date: "Jan 2026"
  content: "Honored to share my previous paper on [*PAIN*](https://journals.lww.com/pain/fulltext/9900/individualizing_musical_tempo_to_spontaneous_rates.810.aspx) has been awarded the the [*Top 10 Discoveries of the Year*](https://www.mcgill.ca/sbms/article/four-mcgill-studies-make-quebec-sciences-list-top-10-discoveries-year) by Québec Science. "

- date: "Jan 2025"
  content: "The first journal article of my Ph.D. is now online in [*PAIN*](https://journals.lww.com/pain/fulltext/9900/individualizing_musical_tempo_to_spontaneous_rates.810.aspx)! It explores how we can better utilize music tempo as a tool to reduce pain."
